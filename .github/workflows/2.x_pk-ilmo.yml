# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - pk-ilmo

on:
  push:
    branches:
      - 2.x
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DC12A2F8CA4B45438427B4FDBD91D255 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_29DF5A742CC348A990D52FF977C864E6 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DC12A2F8CA4B45438427B4FDBD91D255 }}/polyteknikkojen-kuoro/ilmomasiina:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8843EB80CC9A4246B7F292A3BAD31638 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D19003CEBDF14238A82C62B49131787D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FA85E2DFCDD941F594AA6291C42046A8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'pk-ilmo'
          slot-name: 'Production'
          images: 'ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DC12A2F8CA4B45438427B4FDBD91D255 }}/polyteknikkojen-kuoro/ilmomasiina:${{ github.sha }}'
          